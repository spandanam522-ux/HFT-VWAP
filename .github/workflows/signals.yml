name: HFT Quantum Edge signals

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay runs)
  workflow_dispatch:            # lets you press "Run workflow" to test

concurrency:
  group: signals
  cancel-in-progress: false

permissions:
  contents: write               # needed to save state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install yfinance pandas numpy requests

      - name: Check for a new signal
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python hft_quantum_edge_signals.py --once

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
